[package]
name = "rust_timer"
version = "0.1.0"
authors = ["Yuki Komatsu <y-Komatsu@saiseikai-otaru.jp>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
notify-rust = "4.18.2"
tokio = { version = "1.54.0", features = ["time"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
